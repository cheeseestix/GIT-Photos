<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin: 0;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <img src="https://cdn.britannica.com/92/212692-050-D53981F5/labradoodle-dog-stick-running-grass.jpg" alt="A dog happily running and playing">
            <div class="card-content">
                <h3>a dog happily running and playing</h3>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+2" alt="Placeholder Image">
            <div class="card-content">
                <h3>Card Title 2</h3>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+3" alt="Placeholder Image">
            <div class="card-content">
                <h3>Card Title 3</h3>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+4" alt="Placeholder Image">
            <div class="card-content">
                <h3>Card Title 4</h3>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+5" alt="Placeholder Image">
            <div class="card-content">
                <h3>Card Title 5</h3>
            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+6" alt="Placeholder Image">
            <div class="card-content">
                <h3>Card Title 6</h3>
            </div>
        </div>
        <div class="card">

            </div>

            </div>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/400x200?text=Image+9" alt="Placeholder Image">

        </div>
    </div>
</body>
</html>
